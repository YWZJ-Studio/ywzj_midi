plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run/client_1')
            jvmArgument('-XX:+AllowEnhancedClassRedefinition')
        }

        client2 {
            client()
            gameDirectory = project.file('run/client_2')
            programArguments.addAll('--username', 'Ranpoes')
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument('--nogui')
        }

        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll('--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath)
        }
    }
}

repositories {
    mavenCentral()
    flatDir {
        dir 'libs'
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.mcmodderanchor'
        }
    }
}

dependencies {
    // MP3格式音频支持
    jarJar(implementation('com.googlecode.soundlibs:mp3spi:1.9.5.4')) {
        version { strictly '[1.9.5.4,)' }
    }
    jarJar(implementation('com.googlecode.soundlibs:jlayer:1.0.1.4')) {
        version { strictly '[1.0.1.4,)' }
    }
    jarJar(implementation('com.googlecode.soundlibs:tritonus-share:0.3.7.4')) {
        version { strictly '[0.3.7.4,)' }
    }
    // JS支持
    jarJar(implementation('ywzj:rhino:1.8.1-SNAPSHOT')) {
        version {
            strictly '[1.8.1-SNAPSHOT,)'
            prefer '1.8.1-SNAPSHOT'
        }
    }
    additionalRuntimeClasspath 'ywzj:rhino:1.8.1-SNAPSHOT'
    // SBM
    jarJar(modImplementation('com.github.mcmodderanchor:simplebedrockmodel:2.5.1-forge-mc1.20.1')) {
        version {
            strictly '[2.5.1.1-neoforge-mc1.21.1,)'
            prefer '2.5.1.1-neoforge-mc1.21.1'
        }
    }
    compileOnly('com.maydaymemory:mae:1.1.2') {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    includeEmptyDirs = false
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.version,
                'Implementation-Vendor'    : mod_authors,
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.named('jarJar')
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
